name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trialmatch
          POSTGRES_PASSWORD: trialmatch
          POSTGRES_DB: trialmatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trialmatch" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://trialmatch:trialmatch@localhost:5432/trialmatch_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Migrate
        run: alembic upgrade head && alembic check
      - name: Tests (network-free: ClinicalTrials.gov and Claude are mocked)
        run: pytest -q
      - name: Rules-only evaluation
        run: python ../evaluation/run_eval.py --llm none

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
