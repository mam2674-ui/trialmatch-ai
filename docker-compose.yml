services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trialmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trialmatch-local-only}
      POSTGRES_DB: trialmatch
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialmatch"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trialmatch:${POSTGRES_PASSWORD:-trialmatch-local-only}@db:5432/trialmatch
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
